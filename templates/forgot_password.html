{% extends "base.html" %}

{% block title %}Reset Password - AutoCare{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <div class="brand-icon" style="width: 46px; height: 46px; font-size: 1.4rem;">🔑</div>
      </div>
      <h2>Reset Password</h2>
      <p style="font-size: 0.9rem; margin-top: 0.35rem;">Enter your registered account email and set your new password</p>
    </div>

    <form action="{{ url_for('forgot_password') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="reset-email">Registered Email Address</label>
        <input type="email" id="reset-email" name="email" class="form-control" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reset-new-password">New Password (Min 6 chars)</label>
        <input type="password" id="reset-new-password" name="new_password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reset-confirm-password">Confirm New Password</label>
        <input type="password" id="reset-confirm-password" name="confirm_password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">
        Update Password & Log In
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem;">
      Remembered your credentials? 
      <a href="{{ url_for('login') }}" style="font-weight: 600;">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
