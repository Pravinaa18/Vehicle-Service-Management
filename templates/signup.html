{% extends "base.html" %}

{% block title %}Create Account - AutoCare Vehicle Service Management{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" style="max-width: 520px;">
    <div class="auth-header">
      <div class="auth-logo">
        <div class="brand-icon" style="width: 46px; height: 46px; font-size: 1.4rem;">🚗</div>
      </div>
      <h2>Create Your Account</h2>
      <p style="font-size: 0.9rem; margin-top: 0.35rem;">Join AutoCare for seamless maintenance tracking and digital service records</p>
    </div>

    <form action="{{ url_for('signup') }}" method="POST" onsubmit="validateSignupForm(event)">
      <div class="form-group">
        <label class="form-label" for="signup-name">Full Name *</label>
        <input type="text" id="signup-name" name="full_name" class="form-control" placeholder="e.g. Alex Morgan" required>
        <div id="signup-name-error" class="form-text-error"></div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address *</label>
          <input type="email" id="signup-email" name="email" class="form-control" placeholder="alex@example.com" required>
          <div id="signup-email-error" class="form-text-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-phone">Phone Number *</label>
          <input type="tel" id="signup-phone" name="phone" class="form-control" placeholder="+1 (555) 000-0000" required>
          <div id="signup-phone-error" class="form-text-error"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-password">Password (Minimum 6 characters) *</label>
        <input type="password" id="signup-password" name="password" class="form-control" placeholder="••••••••" required oninput="checkPasswordStrength(this.value)">
        <div class="pwd-meter">
          <div id="pwd-meter-fill" class="pwd-meter-fill"></div>
        </div>
        <div id="pwd-strength-label" style="font-size: 0.75rem; margin-top: 4px; text-align: right;"></div>
        <div id="signup-password-error" class="form-text-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-confirm-password">Confirm Password *</label>
        <input type="password" id="signup-confirm-password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        <div id="signup-confirm-password-error" class="form-text-error"></div>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-check">
          <input type="checkbox" required checked>
          <span style="font-size: 0.825rem; color: var(--text-secondary);">
            I agree to the <a href="{{ url_for('terms_conditions') }}" target="_blank">Terms of Service</a> and <a href="{{ url_for('privacy_policy') }}" target="_blank">Privacy Policy</a>
          </span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">
        Register Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem;">
      Already have an account? 
      <a href="{{ url_for('login') }}" style="font-weight: 600;">Log In</a>
    </div>
  </div>
</div>
{% endblock %}
